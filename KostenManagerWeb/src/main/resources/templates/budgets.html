<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budgets</title>

    <link rel="stylesheet" href="/CSS/style.css">
</head>

<body>

<header>
    <nav class="navigation">
        <img class="logo" src="/CSS/img/Logo.png">

        <div class="menu">
            <a class="menu-link" href="/startmenue">Startmenü</a>
            <a class="menu-link" href="/dashboard">Dashboard</a>
            <a class="menu-link" href="/ausgaben">Ausgaben</a>
            <a class="menu-link" href="/schulden">Schulden</a>
            <a class="menu-link" href="/personen">Personen</a>
            <a class="menu-link" href="/logout">Logout</a>
        </div>
    </nav>
</header>

<main>

    <div class="button-container">
        <button class="button" onclick="modalOeffnen()">
            Budget setzen
        </button>
    </div>

    <div class="budget-liste">

        <div th:each="eintrag : ${budgetAnalyse}" class="budget-box">

            <h3 th:text="${eintrag.name()}">Name</h3>

            <p>
                Ausgegeben:
                <span th:text="${eintrag.ausgegeben()}">0</span>
                €
            </p>

            <p>
                Rest:
                <span th:text="${eintrag.restBudget()}">0</span>
                €
            </p>

            <p>
                Status:
                <span class="status"
                      th:classappend="${eintrag.ueberschritten()} ? ' status-bad' : ' status-good'"
                      th:text="${eintrag.ueberschritten()} ? 'Überschritten' : 'OK'">
                    OK
                </span>
            </p>

        </div>

    </div>

</main>

<div id="budgetModal" class="modal">
    <div class="modal-inhalt">

        <h2>Budget setzen</h2>

        <form action="/budget-setzen" method="post">

            <label>Person</label>

            <select name="name" required>
                <option value="">Person auswählen</option>

                <option th:each="person : ${personen}"
                        th:value="${person}"
                        th:text="${person}">
                </option>
            </select>

            <label>Budget</label>

            <input
                    name="budget"
                    type="number"
                    step="0.01"
                    min="0"
                    required>

            <div class="modal-buttons">
                <button type="submit" class="button button-save">
                    Speichern
                </button>

                <button type="button" class="button button-close" onclick="modalSchliessen()">
                    Abbrechen
                </button>
            </div>

        </form>

    </div>
</div>

<script>
    function modalOeffnen() {
        document.getElementById("budgetModal").style.display = "flex";
    }

    function modalSchliessen() {
        document.getElementById("budgetModal").style.display = "none";
    }
</script>

</body>
</html>
