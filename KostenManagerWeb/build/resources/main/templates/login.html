<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="/CSS/style.css">
</head>
<body>

<main>
    <div class="modal-inhalt" style="margin: 100px auto;">
        <h2>Login</h2>

        <p th:if="${fehler}" th:text="${fehler}" style="color: red;"></p>

        <form action="/login" method="post">
            <label>Benutzername</label>
            <input name="username" required>

            <label>Passwort</label>
            <input name="password" type="password" required>

            <button class="button button-save" type="submit">
                Einloggen
            </button>
        </form>

        <p style="margin-top: 24px;">
            Noch kein Konto?
        </p>

        <a class="button" href="/registrieren" style="display: inline-block; text-decoration: none;">
            Account erstellen
        </a>
    </div>
</main>

</body>
</html>
