<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schulden</title>
    <link rel="stylesheet" href="/CSS/style.css">
</head>

<body>

<header>
    <nav class="navigation">
        <img class="logo" src="/CSS/img/Logo.png">

        <div class="menu">
            <a class="menu-link" href="/startmenue">Startmenü</a>
            <a class="menu-link" href="/dashboard">Dashboard</a>
            <a class="menu-link" href="/ausgaben">Ausgaben</a>
            <a class="menu-link" href="/budgets">Budgets</a>
            <a class="menu-link" href="/personen">Personen</a>
            <a class="menu-link" href="/logout">Logout</a>
        </div>
    </nav>
</header>

<main>
    <div class="button-container">
        <button class="button" onclick="modalOeffnen()">
            Schuld begleichen
        </button>
    </div>

    <div class="schulden-liste">
        <div th:each="schuld : ${schulden}" class="schuld-box">
            <h3>
                <span th:text="${schuld.von()}">Von</span>
                schuldet
            </h3>

            <p>
                an
                <strong th:text="${schuld.an()}">An</strong>
            </p>

            <p class="betrag">
                <span th:text="${schuld.betrag()}">0</span> €
            </p>
        </div>
    </div>
</main>

<div id="schuldModal" class="modal">
    <div class="modal-inhalt">
        <h2>Schuld begleichen</h2>

        <form action="/schulden-ausgleichen" method="post">

            <label>Schuldiger</label>

            <select name="von" required>

                <option value="">
                    Person auswählen
                </option>

                <option th:each="person : ${personen}"
                        th:value="${person}"
                        th:text="${person}">
                </option>

            </select>

            <label>Gläubiger</label>

            <select name="an" required>

                <option value="">
                    Person auswählen
                </option>

                <option th:each="person : ${personen}"
                        th:value="${person}"
                        th:text="${person}">
                </option>

            </select>

            <label>Betrag</label>

            <input
                    name="betrag"
                    type="number"
                    step="0.01"
                    min="0.01"
                    required>

            <div class="modal-buttons">

                <button
                        type="submit"
                        class="button button-save">
                    Speichern
                </button>

                <button
                        type="button"
                        class="button button-close"
                        onclick="modalSchliessen()">
                    Abbrechen
                </button>

            </div>

        </form>
    </div>
</div>

<script>
    function modalOeffnen() {
        document.getElementById("schuldModal").style.display = "flex";
    }

    function modalSchliessen() {
        document.getElementById("schuldModal").style.display = "none";
    }
</script>

</body>
</html>
